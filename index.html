<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero on a notched phone; the
      framework's UIRoot reserves those insets so the HUD never sits under a camera cutout.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23b0301f'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23f0e2c4'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' font-family='Songti SC,serif' fill='%23b0301f'%3E%E6%A3%8B%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" content="#1b1210" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>揭棋 · JieQi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1210;
        /* 竖屏手机：把画布外的留白也染成木色，避免出现白边 */
        color: #e8d9b5;
        font-family: 'LXGW WenKai', 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'KaiTi', serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
      }
      /*
        加载页：字体和音乐到位之前压在画布上的那一屏。
        它是 DOM 而不是 Phaser 场景，因为要报进度的两件事（7.9 MB 的霞鹜文楷、3 MB 的音乐）都发生在
        还没有东西可渲染的时候 —— 而且浏览器会在字形到位的那一刻自动重排这行「揭 棋」，所以它既是
        玩家看到的第一屏，也是第一屏就用上正字的。
      */
      #boot-veil {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 40px;
        /* 中间一团微光，和游戏里那块木头桌面是同一个色系 */
        background: radial-gradient(circle at 50% 42%, #2a1c14 0%, #1b1210 62%);
        color: #c8a86a;
        z-index: 10;
        transition: opacity 420ms ease;
      }
      #boot-veil.gone {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        font-size: 42px;
        letter-spacing: 0.34em;
        /* letter-spacing 会在最后一个字后面留一份空隙，缩进同样的量才是真的居中 */
        text-indent: 0.34em;
        color: #e8cf95;
      }
      .boot-sub {
        font-size: 13px;
        letter-spacing: 0.16em;
        color: #8a7444;
      }
      .boot-track {
        width: 210px;
        height: 5px;
        margin-top: 12px;
        border-radius: 999px;
        background: rgba(200, 168, 106, 0.16);
        overflow: hidden;
      }
      .boot-fill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #8a7444, #e8cf95);
        transition: width 200ms ease-out;
      }
      .boot-note {
        font-size: 12px;
        letter-spacing: 0.14em;
        color: #8a7444;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-veil" role="status">
      <div class="boot-mark">揭 棋</div>
      <div class="boot-sub">暗子开局 · 翻开方见真章</div>
      <div
        id="boot-bar"
        class="boot-track"
        role="progressbar"
        aria-label="载入进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="boot-fill" class="boot-fill"></span>
      </div>
      <div id="boot-note" class="boot-note">正在载入字体</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
